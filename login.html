<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار الأجهزة | Shehadeh Center</title>
    <meta name="description" content="أفضل أسعار الأجهزة الإلكترونية والكهربائية">
    
    <link rel="icon" type="image/png" sizes="32x32" href="https://i.postimg.cc/VNssYbVS/IMG-1002.jpg">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1a5276;
            --secondary-color: #2c3e50;
            --accent-color: #c0392b;
            --light-bg: #f5f5f5;
            --white: #ffffff;
            --border-color: #ddd;
            --text-dark: #333;
            --text-muted: #777;
            --success-color: #27ae60;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Tajawal', Arial, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: var(--secondary-color);
            color: var(--white);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }
        
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .header h1 span {
            color: #5dade2;
        }
        
        .header p {
            color: #bdc3c7;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        
        /* Navigation / Tabs */
        .file-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .file-tab {
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 500;
            border: 2px solid var(--border-color);
            background: var(--white);
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .file-tab:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .file-tab.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }
        
        /* Search */
        .search-container {
            padding: 1rem;
            background: var(--white);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .search-container input {
            width: 100%;
            max-width: 500px;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Tajawal', sans-serif;
            transition: border-color 0.2s ease;
        }
        
        .search-container input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        /* Filter Buttons */
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
        }
        
        .filter-btn {
            padding: 0.5rem 1.1rem;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-dark);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .filter-btn:hover {
            background: #eaf2f8;
            border-color: var(--primary-color);
        }
        
        .filter-btn.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }
        
        /* Main Container */
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
        }
        
        /* Category Section */
        .category-section {
            background: var(--white);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .category-header {
            background: var(--primary-color);
            color: var(--white);
            padding: 0.8rem 1.2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 3px solid var(--secondary-color);
        }
        
        /* Price Table */
        .price-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .price-table thead th {
            background: #eaf2f8;
            color: var(--primary-color);
            padding: 0.7rem 1rem;
            text-align: right;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--border-color);
        }
        
        .price-table tbody td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
            text-align: right;
            vertical-align: middle;
        }
        
        .price-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .price-table tbody tr:hover {
            background: #f9fbfc;
        }
        
        .price-table tbody tr:nth-child(even) {
            background: #fafafa;
        }
        
        .price-table tbody tr:nth-child(even):hover {
            background: #f0f5f8;
        }
        
        /* Product Name */
        .product-name {
            font-weight: 500;
            color: var(--text-dark);
            line-height: 1.5;
            word-break: break-word;
        }
        
        /* Price */
        .product-price {
            font-weight: 700;
            font-size: 1rem;
            color: var(--success-color);
            text-align: left;
            direction: ltr;
            white-space: nowrap;
            font-family: 'Tajawal', Arial, sans-serif;
        }
        
        .product-price.unavailable {
            color: var(--accent-color);
            font-weight: 600;
            direction: rtl;
            text-align: center;
        }
        
        /* Row number */
        .row-number {
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 40px;
            text-align: center;
        }
        
        /* Search Highlight */
        .search-highlight {
            background-color: #fff3cd;
            padding: 1px 3px;
            border-radius: 2px;
            font-weight: 700;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: var(--white);
            margin-top: 2rem;
        }
        
        .footer .contact-info {
            margin-bottom: 0.5rem;
            color: var(--secondary-color);
            font-weight: 500;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--border-color);
        }
        
        /* Loading */
        .loading-indicator {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
        
        .loading-indicator i {
            animation: spin 1s linear infinite;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
            color: var(--primary-color);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.4rem;
            }
            
            .file-tab {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
            }
            
            .filter-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
            
            .price-table thead th,
            .price-table tbody td {
                padding: 0.6rem 0.7rem;
                font-size: 0.85rem;
            }
            
            .product-price {
                font-size: 0.9rem;
            }
            
            .category-header {
                font-size: 1rem;
                padding: 0.7rem 1rem;
            }
            
            .main-container {
                padding: 0.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.2rem;
            }
            
            .file-tab {
                padding: 0.4rem 0.6rem;
                font-size: 0.75rem;
            }
            
            .price-table thead th,
            .price-table tbody td {
                padding: 0.5rem;
                font-size: 0.8rem;
            }
            
            .row-number {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Shehadeh <span>Center</span></h1>
        <p>قائمة أسعار الأجهزة الإلكترونية</p>
    </header>
    
    <!-- File Tabs -->
    <nav class="file-tabs" id="file-tabs">
        <!-- Populated by JS -->
    </nav>
    
    <!-- Search -->
    <div class="search-container">
        <input type="text" id="search-box" placeholder="🔍 ابحث عن منتج أو قسم...">
    </div>
    
    <!-- Filter Buttons -->
    <div class="filter-buttons" id="filter-buttons">
        <!-- Populated by JS -->
    </div>
    
    <!-- Main Content -->
    <main class="main-container" id="main-content">
        <div class="loading-indicator">
            <i class="fas fa-spinner"></i>
            جاري تحميل الأسعار...
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="contact-info">
            <i class="fas fa-phone"></i> 0566888825
        </div>
        <div>
            Shehadeh Center &copy; 2025 - جميع الحقوق محفوظة
        </div>
    </footer>

    <script>
        // ========== Configuration ==========
        const fileButtons = [
            { label: 'أسعار الأجهزة', fileName: 'test.md', icon: 'fas fa-mobile-alt' },
            { label: 'أسعار الشاشات', fileName: 'lcd.md', icon: 'fas fa-tv' },
            { label: 'أسعار الاكسسوارات', fileName: 'abc.md', icon: 'fas fa-headphones' },
            { label: 'أسعار معدات الصيانة', fileName: 'tools.md', icon: 'fas fa-tools' },
            { label: 'أسعار قطع صيانة', fileName: 'flex.md', icon: 'fas fa-microchip' },
            { label: 'أسعار البطاريات', fileName: 'batteries.md', icon: 'fas fa-car-battery' }
        ];

        // ========== State ==========
        let products = [];
        let currentFileName = '';
        let currentCategory = 'All';
        let searchTerm = '';
        let isLoading = false;

        // ========== DOM Elements ==========
        const fileTabsContainer = document.getElementById('file-tabs');
        const filterButtonsContainer = document.getElementById('filter-buttons');
        const mainContent = document.getElementById('main-content');
        const searchBox = document.getElementById('search-box');

        // ========== Init ==========
        function init() {
            createFileTabs();
            loadProductsFromFile(fileButtons[0].fileName);
            searchBox.addEventListener('input', handleSearch);
        }

        // ========== File Tabs ==========
        function createFileTabs() {
            fileTabsContainer.innerHTML = '';
            fileButtons.forEach((btn, index) => {
                const tab = document.createElement('button');
                tab.className = 'file-tab' + (index === 0 ? ' active' : '');
                tab.innerHTML = `<i class="${btn.icon}"></i> ${btn.label}`;
                tab.dataset.fileName = btn.fileName;
                tab.onclick = () => {
                    if (isLoading) return;
                    document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = 'All';
                    searchTerm = '';
                    searchBox.value = '';
                    loadProductsFromFile(btn.fileName);
                };
                fileTabsContainer.appendChild(tab);
            });
        }

        // ========== Load Products ==========
        async function loadProductsFromFile(fileName) {
            if (isLoading) return;
            isLoading = true;
            currentFileName = fileName;
            showLoading();

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('File not found');
                const data = await response.text();
                products = parseProducts(data);
                currentCategory = 'All';
                createFilterButtons();
                renderProducts();
            } catch (error) {
                console.error('Error loading file:', error);
                showError('حدث خطأ في تحميل الملف. تأكد من وجود الملف.');
            } finally {
                isLoading = false;
            }
        }

        // ========== Parse Products ==========
        function parseProducts(data) {
            const result = [];
            const lines = data.split('\n');
            lines.forEach(line => {
                // Format: category / name / price / image_url
                const parts = line.split('/');
                if (parts.length >= 3) {
                    const category = parts[0].trim();
                    const name = parts[1].trim();
                    const priceStr = parts[2].trim();
                    if (!category || !name) return;
                    const price = priceStr === '' ? NaN : parseFloat(priceStr);
                    result.push({
                        category,
                        name,
                        price: isNaN(price) ? NaN : price
                    });
                }
            });
            return result;
        }

        // ========== Filter Buttons ==========
        function createFilterButtons() {
            filterButtonsContainer.innerHTML = '';
            if (products.length === 0) return;

            const categories = [...new Set(products.map(p => p.category))];

            // "All" button
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn active';
            allBtn.textContent = 'الكل';
            allBtn.onclick = () => {
                currentCategory = 'All';
                setActiveFilter(allBtn);
                renderProducts();
            };
            filterButtonsContainer.appendChild(allBtn);

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    setActiveFilter(btn);
                    renderProducts();
                };
                filterButtonsContainer.appendChild(btn);
            });
        }

        function setActiveFilter(activeBtn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        // ========== Render Products ==========
        function renderProducts() {
            if (products.length === 0) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        لا توجد منتجات لعرضها
                    </div>`;
                return;
            }

            // Apply filters
            let filtered = products;
            if (currentCategory !== 'All') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(term) ||
                    p.category.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        لا توجد نتائج مطابقة للبحث
                    </div>`;
                return;
            }

            // Group by category
            const grouped = {};
            filtered.forEach(p => {
                if (!grouped[p.category]) grouped[p.category] = [];
                grouped[p.category].push(p);
            });

            // Build HTML
            let html = '';
            for (const [category, items] of Object.entries(grouped)) {
                html += `
                    <div class="category-section">
                        <div class="category-header">${escapeHtml(category)}</div>
                        <table class="price-table">
                            <thead>
                                <tr>
                                    <th style="width:40px;">#</th>
                                    <th>الصنف</th>
                                    <th style="width:120px;text-align:left;">السعر</th>
                                </tr>
                            </thead>
                            <tbody>`;
                items.forEach((item, idx) => {
                    const nameHtml = highlightText(escapeHtml(item.name), searchTerm);
                    const priceHtml = isNaN(item.price)
                        ? '<span class="product-price unavailable">غير متوفر</span>'
                        : `<span class="product-price">${item.price.toFixed(2)} ₪</span>`;
                    html += `
                        <tr>
                            <td class="row-number">${idx + 1}</td>
                            <td class="product-name">${nameHtml}</td>
                            <td>${priceHtml}</td>
                        </tr>`;
                });
                html += `
                            </tbody>
                        </table>
                    </div>`;
            }

            mainContent.innerHTML = html;
        }

        // ========== Search ==========
        function handleSearch() {
            searchTerm = searchBox.value.trim();
            renderProducts();
        }

        // ========== Helpers ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${escapeRegExp(term)})`, 'gi');
            return text.replace(regex, '<mark class="search-highlight">$1</mark>');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function showLoading() {
            mainContent.innerHTML = `
                <div class="loading-indicator">
                    <i class="fas fa-spinner"></i>
                    جاري تحميل الأسعار...
                </div>`;
        }

        function showError(msg) {
            mainContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:var(--accent-color);"></i>
                    ${msg}
                </div>`;
            filterButtonsContainer.innerHTML = '';
        }

        // ========== Start ==========
        window.addEventListener('load', init);
    </script>
</body>
</html>
